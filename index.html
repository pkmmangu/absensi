<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Barcode</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; max-width: 520px; margin: auto; }
    h2 { text-align: center; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; }
    .result {
      margin-top: 16px; padding: 14px; border-radius: 10px;
      background: #f3f4f6; font-size: 15px; line-height: 1.6;
    }
    .result:empty { display: none; }
    .result.ok   { background: #dcfce7; border: 1px solid #16a34a; }
    .result.err  { background: #fee2e2; border: 1px solid #dc2626; }
    .result.warn { background: #fef3c7; border: 1px solid #f59e0b; }
    .hidden { display: none !important; }

    .result.ok   i { color: #16a34a; }
    .result.err  i { color: #dc2626; }
    .result.warn i { color: #f59e0b; }
    .result i { margin-right: 6px; }
  </style>
</head>
<body>
  <h2 id="title">Absensi Barcode</h2>
  <div id="reader"></div>

  <div class="result" id="result"></div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzup4hPq9gLj469YznW3JrJasyFgDUFTCBKqERTUaMPRPMNAS988EWO1q2IyjS_zzf7/exec';

    // ===== Baca ?user= dari URL =====
    const urlParams = new URLSearchParams(window.location.search);
    const USER_ID = (urlParams.get('user') || '').trim();

    let html5QrCode = null;
    let scanning = false;
    let lastScan = '';
    let lastScanTime = 0;

    if (USER_ID) {
      // Sembunyikan judul kalau user terdeteksi
      document.getElementById('title').classList.add('hidden');
      window.addEventListener('load', startScan);
    } else {
      // Tanpa user: tampilkan judul, sembunyikan kamera, tampilkan warning
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('result').innerHTML =
        '<b><i class="fas fa-exclamation-triangle"></i> Peringatan:</b> Akses dengan Aplikasi SIMANGU untuk melakukan Absensi';
      document.getElementById('result').className = 'result err';
    }

    function startScan() {
      if (scanning) return;
      if (!USER_ID) return;

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        () => {}
      ).then(() => { scanning = true; })
       .catch(err => setResult('<i class="fas fa-times-circle"></i> Gagal akses kamera: ' + err, 'err'));
    }

    function stopScan() {
      if (!scanning || !html5QrCode) return;
      html5QrCode.stop().then(() => {
        scanning = false;
        html5QrCode.clear();
        html5QrCode = null;
      }).catch(() => {
        scanning = false;
        html5QrCode = null;
      });
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastScan && now - lastScanTime < 3000) return;
      lastScan = decodedText;
      lastScanTime = now;

      stopScan();
      setResult('<i class="fas fa-spinner fa-spin"></i> Memproses…');

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          barcode: decodedText,
          user: USER_ID
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.duplicate) {
          setResult(
            `<b><i class="fas fa-info-circle"></i> Sudah Absen</b><br>
             Nama: <b>${res.nama}</b><br>
             Tanggal: ${res.tanggal}<br>
             <small>${res.message}</small>`,
            'warn'
          );
          return;
        }

        if (!res.success) {
          setResult('<b><i class="fas fa-times-circle"></i> Gagal</b><br>' + res.message, 'err');
          return;
        }

        const ket = res.keterangan || '-';
        setResult(
          `<b><i class="fas fa-check-circle"></i> Berhasil disimpan</b><br>
           Nama: <b>${res.nama}</b><br>
           Tanggal: <b>${res.tanggal}</b><br>
           Absen: ${res.absen}<br>
           Keterangan: <b>${ket}</b>`,
          'ok'
        );
      })
      .catch(err => setResult('<i class="fas fa-times-circle"></i> Error: ' + err.message, 'err'));
    }

    function setResult(html, cls) {
      const el = document.getElementById('result');
      el.className = 'result' + (cls ? ' ' + cls : '');
      el.innerHTML = html;
    }
  </script>
</body>
</html>
